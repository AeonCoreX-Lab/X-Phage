name: Mirror Release with Assets to Codeberg

on:
  release:
    types: [published]

jobs:
  mirror-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release on Codeberg
        id: create_release
        run: |
          response=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://codeberg.org/api/v1/repos/AeonCoreX/X-Phage/releases \
            -d '{
              "tag_name": "${{ github.event.release.tag_name }}",
              "name": "${{ github.event.release.name }}",
              "body": "${{ github.event.release.body }}",
              "draft": false,
              "prerelease": false
            }')
          echo "id=$(echo $response | jq -r .id)" >> $GITHUB_OUTPUT

      - name: Upload Assets to Codeberg
        run: |
          for file in ./dist/*; do
            curl -X POST \
              -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
              -F "attachment=@$file" \
              https://codeberg.org/api/v1/repos/AeonCoreX/X-Phage/releases/${{ steps.create_release.outputs.id }}/assets
          done