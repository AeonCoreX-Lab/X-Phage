name: X-Phage Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: xphage_linux_x64
            asset_name: xphage_linux_x64

          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact_name: xphage_linux_arm64
            asset_name: xphage_linux_arm64

          - os: windows-latest
            target: windows
            artifact_name: xphage.exe
            asset_name: xphage_windows_x64

          - os: windows-latest
            target: windows-arm64
            artifact_name: xphage_arm64.exe
            asset_name: xphage_windows_arm64

          - os: macos-latest
            target: macos-arm64
            artifact_name: xphage_mac_arm64
            asset_name: xphage_macos_arm64

          - os: macos-13
            target: macos-x64
            artifact_name: xphage_mac_x64
            asset_name: xphage_macos_x64

          - os: ubuntu-latest
            target: android
            artifact_name: xphage_android_arm64
            asset_name: xphage_android_arm64

          - os: macos-latest
            target: ios
            artifact_name: xphage_ios_arm64
            asset_name: xphage_ios_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (Linux/Android)
        if: startsWith(matrix.target, 'linux') || matrix.target == 'android'
        run: |
          sudo apt-get update
          LLVM=$(apt-cache search '^llvm-[0-9]+$' | grep -oP 'llvm-\K[0-9]+' | sort -n | tail -1)
          [ -z "$LLVM" ] && LLVM=18
          sudo apt-get install -y llvm-${LLVM} llvm-${LLVM}-dev \
            clang-${LLVM} lld-${LLVM}
          sudo ln -sf /usr/bin/llvm-config-${LLVM} /usr/bin/llvm-config || true
          sudo ln -sf /usr/bin/clang++-${LLVM} /usr/bin/clang++ || true
          [ "${{ matrix.target }}" = "android" ] && \
            sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Install LLVM (Windows x64)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          C:/msys64/usr/bin/pacman.exe -S --noconfirm \
            mingw-w64-x86_64-llvm mingw-w64-x86_64-clang mingw-w64-x86_64-gcc
          echo "C:\\msys64\\mingw64\\bin" >> $GITHUB_PATH

      - name: Setup MSVC (Windows ARM64)
        if: matrix.target == 'windows-arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update && brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: bash scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: bin/${{ matrix.target }}/
          if-no-files-found: warn

  darwin-universal:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: xphage_macos_arm64, path: ./darwin/arm64 }
      - uses: actions/download-artifact@v4
        with: { name: xphage_macos_x64, path: ./darwin/x64 }
      - name: lipo merge
        run: |
          mkdir -p ./darwin/universal
          lipo -create ./darwin/arm64/xphage_mac_arm64 \
                       ./darwin/x64/xphage_mac_x64 \
               -output ./darwin/universal/xphage_mac_universal
          lipo -info ./darwin/universal/xphage_mac_universal
          shasum -a 256 ./darwin/universal/xphage_mac_universal \
            | awk '{print $1}' > ./darwin/universal/xphage_mac_universal.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: xphage_macos_universal
          path: ./darwin/universal/

  release:
    needs: [build, darwin-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: ./assets }

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: assets/**/*
          body: |
            ## 🧬 X-Phage ${{ github.ref_name }}

            ### Install
            ```bash
            curl -sL https://raw.githubusercontent.com/AeonCoreX-Lab/X-Phage/main/scripts/install.sh | bash
            ```

            ### Platforms
            | Binary | Platform |
            |--------|----------|
            | `xphage_linux_x64` | Linux x86-64 |
            | `xphage_linux_arm64` | Linux ARM64 |
            | `xphage_windows_x64.exe` | Windows x64 |
            | `xphage_windows_arm64.exe` | Windows ARM64 |
            | `xphage_mac_universal` | macOS Universal (arm64 + x64) |
            | `xphage_android_arm64` | Android / Termux |
            | `xphage_ios_arm64` | iOS ARM64 |

            ### XPM (Package Manager)
            ```bash
            curl -sL https://raw.githubusercontent.com/AeonCoreX-Lab/XPM/main/scripts/install.sh | bash
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/xphage:latest
            ${{ secrets.DOCKER_USERNAME }}/xphage:${{ env.VERSION }}
