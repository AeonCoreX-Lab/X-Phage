name: X-Phage Titan Modular Builder & Docker Auto-Sync

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:
  
# ---------------------------------------------------------
# 🔐 FIX: Grant Write Permissions for GitHub Release
# ---------------------------------------------------------
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------
  # Job 1: Build Binaries for all OS & Architectures
  # ---------------------------------------------------------
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: xphage_linux_x64
            asset_name: xphage_linux_x64

          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact_name: xphage_linux_arm64
            asset_name: xphage_linux_arm64

          - os: windows-latest
            target: windows
            artifact_name: xphage.exe
            asset_name: xphage_windows_x64

          - os: windows-latest
            target: windows-arm64
            artifact_name: xphage_arm64.exe
            asset_name: xphage_windows_arm64

          - os: macos-latest
            target: macos
            artifact_name: xphage_mac
            asset_name: xphage_macos_universal

          - os: ubuntu-latest
            target: android
            artifact_name: xphage_android_arm64
            asset_name: xphage_android_arm64

          - os: macos-latest
            target: ios
            artifact_name: xphage_ios_arm64
            asset_name: xphage_ios_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Linux / Android: install latest LLVM + cross-compilers
      # linux-arm64 runs on ubuntu-24.04-arm (native) so no cross-compiler needed.
      # ------------------------------------------------------------------
      - name: Install Latest LLVM & Cross-Compilers (Linux)
        if: startsWith(matrix.target, 'linux') || matrix.target == 'android'
        run: |
          sudo apt-get update
          LLVM_VERSION=$(apt-cache search '^llvm-[0-9]+$' \
            | grep -oP 'llvm-\K[0-9]+' | sort -n | tail -1)
          [ -z "$LLVM_VERSION" ] && LLVM_VERSION=18
          echo "Installing LLVM $LLVM_VERSION"
          sudo apt-get install -y \
            llvm-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION} lld-${LLVM_VERSION}
          sudo ln -sf /usr/bin/llvm-config-${LLVM_VERSION} /usr/bin/llvm-config || true
          sudo ln -sf /usr/bin/clang++-${LLVM_VERSION} /usr/bin/clang++ || true
          # Android still needs the aarch64 cross-compiler
          if [ "${{ matrix.target }}" == "android" ]; then
            sudo apt-get install -y g++-aarch64-linux-gnu
          fi

      # ------------------------------------------------------------------
      # Windows x64: install LLVM + MinGW via MSYS2
      # ------------------------------------------------------------------
      - name: Install LLVM & MinGW (Windows x64)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          echo "Installing MSYS2 MinGW LLVM & Clang..."
          C:/msys64/usr/bin/pacman.exe -S --noconfirm mingw-w64-x86_64-llvm mingw-w64-x86_64-clang mingw-w64-x86_64-gcc
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH

      # ------------------------------------------------------------------
      # Windows ARM64: Setup MSVC environment using VS Enterprise
      # which is pre-installed on windows-latest runners.
      #
      # ROOT FIX: Do NOT install visualstudio2022buildtools via choco.
      # When VS Enterprise is already installed, choco BuildTools install
      # produces an incomplete INCLUDE env (missing MSVC STL headers).
      # ilammy/msvc-dev-cmd finds VS Enterprise automatically via vswhere
      # and sets the full correct INCLUDE + LIB environment.
      # ------------------------------------------------------------------
      - name: Setup MSVC Environment (Windows ARM64)
        if: matrix.target == 'windows-arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      # ------------------------------------------------------------------
      # macOS: install latest Homebrew LLVM
      # ------------------------------------------------------------------
      - name: Install Latest LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/llvm/bin"    >> $GITHUB_PATH

      # ------------------------------------------------------------------
      # Build step
      # ------------------------------------------------------------------
      - name: Build X-Phage
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: bash build.sh

      # ------------------------------------------------------------------
      # Upload full bin/<target>/ folder (binary + .sha256 sidecar)
      # ------------------------------------------------------------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: bin/${{ matrix.target }}/
          if-no-files-found: warn

  # ---------------------------------------------------------
  # Job 2: GitHub Release Creation
  # ---------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./assets

      - name: List downloaded assets (debug)
        run: find ./assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            assets/**/*
          body: |
            ## 🧬 X-Phage v3.4.0 – Standard Library & Package Manager Expansion
            
            Welcome to the **v3.4.0** release of X-Phage! This update brings a fully production‑ready standard library and a powerful package manager, making the language self‑sufficient and easier than ever to use.

            ### 🚀 New Features
            - **Complete Standard Library (`stdlib/`)**  
              Pre‑built modules for:
              - `core/` – system info, process control, memory management
              - `math/` – trigonometry, vectors, matrices, GPU/NPU support
              - `io/` – file operations, colored console logging
              - `net/` – HTTP requests, TCP/UDP sockets
              - `data/` – SIMD‑optimized JSON, advanced string handling
              - `media/` – hardware‑accelerated streaming (MPV, ExoPlayer)
              - `security/` – AES‑256, SHA‑3, Void protocol memory wipe
              - `ui/` – Titan Fusion UI components (Vortex, Orbit, etc.)
            - **XPM (X‑Phage Package Manager) Upgrades**
              - `xphage update-stdlib` – downloads the entire standard library with a single command.
              - `xphage sync <module>` now supports nested paths (e.g., `net/http`).
            - **REPL Banner & Help**  
              Interactive shell now displays a clean ASCII banner, version, and developer info. Type `help` for available commands.
            - **Improved Linker**  
              The `~link` directive automatically resolves includes from both `stdlib/` and `modules/`, so you can import system libraries without extra configuration.

            ### ⚡ Performance & Compatibility
            - **LLVM Backend** upgraded to support LLVM 16–22+ with version‑aware code.
            - **Windows ARM64** builds now use the correct MSVC environment (no more missing STL headers).
            - **Linux ARM64** builds run natively on Ubuntu 24.04 ARM runners.
            - **iOS builds** are now fixed – all system calls are properly guarded, and the compiler passes.
            - **SHA256 checksums** are automatically generated for every binary, ensuring supply‑chain security.

            ### 📦 Docker Integration
            The official Docker image has been updated to include the new stdlib. Pull it with:
            ```bash
            docker pull aeoncorex/x-phage:latest
            docker run --rm aeoncorex/x-phage --version
            ```

            ### 📚 Documentation
            The manual (`manual.md`) has been completely revised with examples and explanations of the new stdlib modules and XPM commands.

            ### 🛠 How to Get Started
            1. **Install the binary** (see [README](https://github.com/AeonCoreX-Lab/X-Phage#installation)).
            2. **Update the standard library**:
               ```bash
               xphage update-stdlib
               ```
            3. **Create a new project**:
               ```bash
               xphage init
               ```
            4. **Start coding** – write your `.xp0` file and import libraries with `~link`.

            ### 🙏 Contributors
            Special thanks to the AeonCoreX Lab team and the open‑source community for testing and feedback.

            ### 🔮 Roadmap Ahead
            Next up: v3.5 will bring neural interface integration and real‑time synthesis.

            Happy coding! 🚀
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # Job 3: Docker Hub Auto-Publish
  # ---------------------------------------------------------
  docker-publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/xphage:latest
            ${{ secrets.DOCKER_USERNAME }}/xphage:${{ env.VERSION }}