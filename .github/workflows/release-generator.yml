name: X-Phage Titan Modular Builder & Docker Auto-Sync

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------
  # Job 1: Build Binaries for all OS & Architectures
  # ---------------------------------------------------------
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: xphage_linux_x64
            asset_name: xphage_linux_x64

          # FIX: Use native ARM64 runner — eliminates cross-compile sysroot
          # issues and allows LLVM to build natively on ARM64 hardware.
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact_name: xphage_linux_arm64
            asset_name: xphage_linux_arm64

          - os: windows-latest
            target: windows
            artifact_name: xphage.exe
            asset_name: xphage_windows_x64

          - os: windows-latest
            target: windows-arm64
            artifact_name: xphage_arm64.exe
            asset_name: xphage_windows_arm64

          - os: macos-latest
            target: macos
            artifact_name: xphage_mac
            asset_name: xphage_macos_universal

          - os: ubuntu-latest
            target: android
            artifact_name: xphage_android_arm64
            asset_name: xphage_android_arm64

          - os: macos-latest
            target: ios
            artifact_name: xphage_ios_arm64
            asset_name: xphage_ios_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Linux / Android: install latest LLVM + cross-compilers
      # linux-arm64 now runs on a native ARM64 runner so no cross-compiler
      # needed — LLVM installs and runs natively.
      # ------------------------------------------------------------------
      - name: Install Latest LLVM & Cross-Compilers (Linux)
        if: startsWith(matrix.target, 'linux') || matrix.target == 'android'
        run: |
          sudo apt-get update
          LLVM_VERSION=$(apt-cache search '^llvm-[0-9]+$' \
            | grep -oP 'llvm-\K[0-9]+' | sort -n | tail -1)
          [ -z "$LLVM_VERSION" ] && LLVM_VERSION=18
          echo "Installing LLVM $LLVM_VERSION"
          sudo apt-get install -y \
            llvm-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION} lld-${LLVM_VERSION}
          sudo ln -sf /usr/bin/llvm-config-${LLVM_VERSION} /usr/bin/llvm-config || true
          sudo ln -sf /usr/bin/clang++-${LLVM_VERSION} /usr/bin/clang++ || true
          # Android still needs the aarch64 cross-compiler
          if [ "${{ matrix.target }}" == "android" ]; then
            sudo apt-get install -y g++-aarch64-linux-gnu
          fi

      # ------------------------------------------------------------------
      # Windows: install LLVM + MinGW via MSYS2
      # ------------------------------------------------------------------
      - name: Install LLVM & MinGW (Windows MSYS2)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          echo "Installing MSYS2 MinGW LLVM & Clang (provides dev headers & llvm-config)..."
          C:/msys64/usr/bin/pacman.exe -S --noconfirm mingw-w64-x86_64-llvm mingw-w64-x86_64-clang mingw-w64-x86_64-gcc
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH

      # ------------------------------------------------------------------
      # Windows ARM64: MSVC cross-compile environment
      # ------------------------------------------------------------------
      - name: Install ARM64 cross-compile support (Windows ARM64)
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          choco install visualstudio2022buildtools `
            --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.ARM64" `
            --force --no-progress -y
          choco install llvm --force --no-progress -y
          Write-Host "✔ ARM64 MSVC runtime libs & Standard LLVM installed"

      - name: Setup MSVC Environment (Windows ARM64)
        if: matrix.target == 'windows-arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      # ------------------------------------------------------------------
      # macOS: install latest Homebrew LLVM
      # ------------------------------------------------------------------
      - name: Install Latest LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/llvm/bin"    >> $GITHUB_PATH

      # ------------------------------------------------------------------
      # Build step
      # ------------------------------------------------------------------
      - name: Build X-Phage
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: bash build.sh

      # ------------------------------------------------------------------
      # Upload full bin/<target>/ folder (binary + .sha256 sidecar)
      # ------------------------------------------------------------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: bin/${{ matrix.target }}/
          if-no-files-found: warn

  # ---------------------------------------------------------
  # Job 2: GitHub Release Creation
  # ---------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./assets

      - name: List downloaded assets (debug)
        run: find ./assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            assets/**/*
          body: |
            ### 🧬 X-Phage Titan Omni-Platform Release
            - **Fixed:** Windows LLVM Native Build Missing Headers (`llvm-config.h`) fixed using MSYS2.
            - **New:** Added Windows ARM64 Architecture Support.
            - **New:** Linux ARM64 now builds natively on ARM64 hardware with full LLVM support.
            - **Security:** SHA256 Checksums automatically generated and uploaded for all binaries.
            - **Architecture:** Native LLVM Code Generation enabled for Linux, macOS, Windows, and Android.
            - **Docker Support:** Available on Docker Hub.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # Job 3: Docker Hub Auto-Publish
  # ---------------------------------------------------------
  docker-publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/xphage:latest
            ${{ secrets.DOCKER_USERNAME }}/xphage:${{ env.VERSION }}
