name: X-Phage Titan Modular Builder & Docker Auto-Sync

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Build Binaries — all OS & Architectures
  # ─────────────────────────────────────────────────────────
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: xphage_linux_x64
            asset_name: xphage_linux_x64

          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact_name: xphage_linux_arm64
            asset_name: xphage_linux_arm64

          - os: windows-latest
            target: windows
            artifact_name: xphage.exe
            asset_name: xphage_windows_x64

          - os: windows-latest
            target: windows-arm64
            artifact_name: xphage_arm64.exe
            asset_name: xphage_windows_arm64

          # Darwin: both built on macos-latest (ARM64) with -arch flags.
          # macos-13 (Intel) is retired on GitHub Actions — use cross-compilation.
          # Apple Clang on ARM64 can cross-compile x86_64 natively with -arch x86_64.
          - os: macos-latest
            target: macos-arm64
            artifact_name: xphage_mac_arm64
            asset_name: xphage_macos_arm64

          - os: macos-latest
            target: macos-x64
            artifact_name: xphage_mac_x64
            asset_name: xphage_macos_x64

          - os: ubuntu-latest
            target: android
            artifact_name: xphage_android_arm64
            asset_name: xphage_android_arm64

          - os: macos-latest
            target: ios
            artifact_name: xphage_ios_arm64
            asset_name: xphage_ios_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Linux / Android: latest LLVM ─────────────────────
      - name: Install LLVM (Linux)
        if: startsWith(matrix.target, 'linux') || matrix.target == 'android'
        run: |
          sudo apt-get update
          LLVM_VERSION=$(apt-cache search '^llvm-[0-9]+$' \
            | grep -oP 'llvm-\K[0-9]+' | sort -n | tail -1)
          [ -z "$LLVM_VERSION" ] && LLVM_VERSION=18
          echo "Installing LLVM $LLVM_VERSION"
          sudo apt-get install -y \
            llvm-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION} lld-${LLVM_VERSION}
          sudo ln -sf /usr/bin/llvm-config-${LLVM_VERSION} /usr/bin/llvm-config || true
          sudo ln -sf /usr/bin/clang++-${LLVM_VERSION}     /usr/bin/clang++     || true
          if [ "${{ matrix.target }}" = "android" ]; then
            sudo apt-get install -y g++-aarch64-linux-gnu
          fi

      # ── Windows x64: MSYS2 MinGW LLVM ───────────────────
      - name: Install LLVM (Windows x64)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          C:/msys64/usr/bin/pacman.exe -S --noconfirm \
            mingw-w64-x86_64-llvm mingw-w64-x86_64-clang mingw-w64-x86_64-gcc
          echo "C:\\msys64\\mingw64\\bin" >> $GITHUB_PATH

      # ── Windows ARM64: VS Enterprise MSVC ───────────────
      # ROOT FIX: do NOT install choco BuildTools alongside VS Enterprise.
      # ilammy finds VS Enterprise via vswhere and sets the full INCLUDE+LIB.
      - name: Setup MSVC (Windows ARM64)
        if: matrix.target == 'windows-arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      # ── macOS: Homebrew LLVM ─────────────────────────────
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/llvm/bin"    >> $GITHUB_PATH

      # ── Build ─────────────────────────────────────────────
      - name: Build X-Phage
        shell: bash
        env:
          TARGET:        ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: bash scripts/build.sh

      # ── Upload bin/<target>/ (binary + .sha256) ──────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: bin/${{ matrix.target }}/
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────
  # Job 2: Darwin Universal Binary (lipo)
  # Runs after both macos-arm64 and macos-x64 complete.
  # ─────────────────────────────────────────────────────────
  darwin-universal:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: xphage_macos_arm64
          path: ./darwin/arm64

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: xphage_macos_x64
          path: ./darwin/x64

      - name: Create Universal Binary with lipo
        run: |
          mkdir -p ./darwin/universal
          lipo -create \
            ./darwin/arm64/xphage_mac_arm64 \
            ./darwin/x64/xphage_mac_x64 \
            -output ./darwin/universal/xphage_mac_universal
          lipo -info ./darwin/universal/xphage_mac_universal
          shasum -a 256 ./darwin/universal/xphage_mac_universal \
            | awk '{print $1}' > ./darwin/universal/xphage_mac_universal.sha256
          echo "✔ Universal binary created"
          echo "✔ SHA256 generated"

      - name: Upload Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: xphage_macos_universal
          path: ./darwin/universal/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Job 3: GitHub Release
  # ─────────────────────────────────────────────────────────
  release:
    needs: [build, darwin-universal]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./assets

      - name: List assets (debug)
        run: find ./assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            assets/**/*
          body: |
            ## 🧬 X-Phage ${{ github.ref_name }}

            ### Install
            ```bash
            curl -sL https://raw.githubusercontent.com/AeonCoreX-Lab/X-Phage/main/scripts/install.sh | bash
            ```

            ### Platforms
            | Binary | Platform |
            |--------|----------|
            | `xphage_linux_x64` | Linux x86-64 |
            | `xphage_linux_arm64` | Linux ARM64 |
            | `xphage_windows_x64.exe` | Windows x64 |
            | `xphage_windows_arm64.exe` | Windows ARM64 |
            | `xphage_mac_universal` | macOS Universal (arm64 + x64) |
            | `xphage_android_arm64` | Android / Termux |
            | `xphage_ios_arm64` | iOS ARM64 |

            ### XPM (Package Manager)
            ```bash
            curl -sL https://raw.githubusercontent.com/AeonCoreX-Lab/XPM/main/scripts/install.sh | bash
            ```

            ### SHA256 Checksums
            Each binary includes a `.sha256` sidecar file for integrity verification.

            ### Docker
            ```bash
            docker pull ${{ secrets.DOCKER_USERNAME }}/xphage:latest
            docker run --rm ${{ secrets.DOCKER_USERNAME }}/xphage --version
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────
  # Job 4: Docker Hub Auto-Publish
  # ─────────────────────────────────────────────────────────
  docker-publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/xphage:latest
            ${{ secrets.DOCKER_USERNAME }}/xphage:${{ env.VERSION }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
