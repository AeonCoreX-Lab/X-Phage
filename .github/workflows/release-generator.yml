name: X-Phage Titan Modular Builder (LLVM Optimized)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write
      
    strategy:
      fail-fast: false
      matrix:
        include:
          # 🐧 Linux
          - os: ubuntu-latest
            target: linux
            artifact_name: xphage_linux_x64
            asset_name: xphage_linux_x64
            
          # 🪟 Windows
          - os: windows-latest
            target: windows
            artifact_name: xphage.exe
            asset_name: xphage_windows_x64
            
          # 🍎 macOS
          - os: macos-latest
            target: macos
            artifact_name: xphage_mac
            asset_name: xphage_macos_universal

          # 🤖 Android
          - os: ubuntu-latest
            target: android
            artifact_name: xphage_android_arm64
            asset_name: xphage_android_arm64
            
          # 📱 iOS (Requires macOS runner)
          - os: macos-latest
            target: ios
            artifact_name: xphage_ios_arm64
            asset_name: xphage_ios_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Setup ---
      - name: Install LLVM (Linux/Android)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang lld

      # macOS-এ আলাদা করে LLVM ইন্সটল করার দরকার নেই যদি আপনি অ্যাপল ক্ল্যাং (Xcode) ব্যবহার করেন।
      # তবে যদি স্পেসিফিক ভার্সন লাগে, তবে রাখতে পারেন।
      # আমি এখানে ডিফল্ট Xcode Clang ব্যবহারের রিকমেন্ড করছি iOS/Mac এর জন্য।

      # --- Build Execution ---
      - name: Make Script Executable
        run: chmod +x build.sh

      - name: Run Modular Build Script
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: ./build.sh

      # --- Packaging ---
      - name: Prepare Release Bundle
        shell: bash
        run: |
          mkdir -p release_bundle/stdlib
          mkdir -p release_bundle/samples
          
          echo "Looking for binary in: bin/${{ matrix.target }}/${{ matrix.artifact_name }}"
          
          # পাথ চেক এবং কপি
          if [ -f "bin/${{ matrix.target }}/${{ matrix.artifact_name }}" ]; then
            cp "bin/${{ matrix.target }}/${{ matrix.artifact_name }}" release_bundle/
          else
            echo "::error::Binary not found at expected path!"
            exit 1
          fi
          
          # রিসোর্স কপি (যদি থাকে, এরর ইগনোর করবে)
          cp stdlib/*.xh release_bundle/stdlib/ || echo "No stdlib found"
          cp samples/* release_bundle/samples/ || echo "No samples found"
          
          # জিপ করা
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ${{ matrix.asset_name }}.zip ./release_bundle/*
          else
            zip -r ${{ matrix.asset_name }}.zip ./release_bundle/*
          fi

      # --- Upload ---
      - name: Upload Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}.zip
