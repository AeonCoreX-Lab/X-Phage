name: X-Phage Titan Modular Builder & Docker Auto-Sync

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------
  # Job 1: Build Binaries for all OS & Architectures
  # ---------------------------------------------------------
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: xphage_linux_x64
            asset_name: xphage_linux_x64
            
          - os: ubuntu-latest
            target: linux-arm64
            artifact_name: xphage_linux_arm64
            asset_name: xphage_linux_arm64
            
          - os: windows-latest
            target: windows
            artifact_name: xphage.exe
            asset_name: xphage_windows_x64
            
          - os: macos-latest
            target: macos
            artifact_name: xphage_mac
            asset_name: xphage_macos_universal

          - os: ubuntu-latest
            target: android
            artifact_name: xphage_android_arm64
            asset_name: xphage_android_arm64
            
          - os: macos-latest
            target: ios
            artifact_name: xphage_ios_arm64
            asset_name: xphage_ios_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup for Linux/Android
      - name: Install LLVM & Cross-Compilers (Linux)
        if: startsWith(matrix.target, 'linux') || matrix.target == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm llvm-dev clang lld
          if [ "${{ matrix.target }}" == "linux-arm64" ] || [ "${{ matrix.target }}" == "android" ]; then
            sudo apt-get install -y g++-aarch64-linux-gnu
          fi

      # Setup for Windows (Using Chocolatey instead of sudo)
      - name: Install MinGW (Windows)
        if: matrix.target == 'windows'
        run: |
          choco install mingw --force
          
      # Build Step
      - name: Build X-Phage
        shell: bash
        run: |
          export TARGET=${{ matrix.target }}
          bash build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: bin/${{ matrix.target }}/${{ matrix.artifact_name }}

  # ---------------------------------------------------------
  # Job 2: GitHub Release Creation
  # ---------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./assets

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            assets/xphage_linux_x64/xphage_linux_x64
            assets/xphage_linux_arm64/xphage_linux_arm64
            assets/xphage_windows_x64/xphage.exe
            assets/xphage_macos_universal/xphage_mac
            assets/xphage_android_arm64/xphage_android_arm64
            assets/xphage_ios_arm64/xphage_ios_arm64
          body: |
            ### 🧬 X-Phage Titan v3.3.0
            - **Fixed:** Multi-Architecture Build Support (iOS/Android/Windows).
            - **Docker Support:** Available on Docker Hub.
            - **Architecture:** Native LLVM Code Generation (Desktop Only).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # Job 3: Docker Hub Auto-Publish
  # ---------------------------------------------------------
  docker-publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/xphage:latest
            ${{ secrets.DOCKER_USERNAME }}/xphage:${{ env.VERSION }}
