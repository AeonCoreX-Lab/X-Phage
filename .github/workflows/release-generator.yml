name: X-Phage Titan Modular Builder & Docker Auto-Sync

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------
  # Job 1: Build Binaries for all OS & Architectures
  # ---------------------------------------------------------
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: xphage_linux_x64
            asset_name: xphage_linux_x64

          - os: ubuntu-latest
            target: linux-arm64
            artifact_name: xphage_linux_arm64
            asset_name: xphage_linux_arm64

          - os: windows-latest
            target: windows
            artifact_name: xphage.exe
            asset_name: xphage_windows_x64

          - os: windows-latest
            target: windows-arm64
            artifact_name: xphage_arm64.exe
            asset_name: xphage_windows_arm64

          - os: macos-latest
            target: macos
            artifact_name: xphage_mac
            asset_name: xphage_macos_universal

          - os: ubuntu-latest
            target: android
            artifact_name: xphage_android_arm64
            asset_name: xphage_android_arm64

          - os: macos-latest
            target: ios
            artifact_name: xphage_ios_arm64
            asset_name: xphage_ios_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Linux / Android: install latest LLVM + cross-compilers
      # ------------------------------------------------------------------
      - name: Install Latest LLVM & Cross-Compilers (Linux)
        if: startsWith(matrix.target, 'linux') || matrix.target == 'android'
        run: |
          sudo apt-get update
          LLVM_VERSION=$(apt-cache search '^llvm-[0-9]+$' \
            | grep -oP 'llvm-\K[0-9]+' | sort -n | tail -1)
          [ -z "$LLVM_VERSION" ] && LLVM_VERSION=18
          echo "Installing LLVM $LLVM_VERSION"
          sudo apt-get install -y \
            llvm-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION} lld-${LLVM_VERSION}
          sudo ln -sf /usr/bin/llvm-config-${LLVM_VERSION} /usr/bin/llvm-config || true
          sudo ln -sf /usr/bin/clang++-${LLVM_VERSION} /usr/bin/clang++ || true
          if [ "${{ matrix.target }}" == "linux-arm64" ] || \
             [ "${{ matrix.target }}" == "android" ]; then
            sudo apt-get install -y g++-aarch64-linux-gnu
          fi

      # ------------------------------------------------------------------
      # Windows: install LLVM + MinGW via Chocolatey.
      #
      # ROOT CAUSE (v5.5 fix):
      #   Chocolatey installs llvm-config.exe but it requires MSVC runtime
      #   to execute. GitHub-hosted Windows runners do NOT have Visual Studio
      #   unless explicitly installed. Result: llvm-config.exe exits non-zero
      #   silently → build.sh sees empty LLVM_CONF → Transpiler fallback.
      #
      # Fix strategy:
      #   1. Install LLVM + MinGW as before (LLVM headers/libs are still usable).
      #   2. Also install LLVM static libs via winlibs or direct choco package.
      #   3. build.sh v5.5 detects the broken llvm-config and uses a new
      #      build_windows_llvm_manual() function that hard-codes the known
      #      Chocolatey install paths and links directly against LLVM .a libs
      #      using MinGW's ld.
      # ------------------------------------------------------------------
      - name: Install LLVM & MinGW (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          choco install llvm mingw --force --no-progress -y

          $llvmBin = "C:\Program Files\LLVM\bin"
          "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Add MinGW to PATH so ld.exe / libstdc++ are available for LLVM manual link
          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          if (Test-Path $mingwBin) {
            "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "✔ MinGW bin added to PATH: $mingwBin"
          }

          # Verify clang++ (must exist)
          if (Test-Path "$llvmBin\clang++.exe") {
            Write-Host "✔ clang++.exe found: $llvmBin\clang++.exe"
          } else {
            Write-Host "✘ clang++.exe NOT found — build will fail"
            exit 1
          }

          # Test llvm-config executability (expected to fail without MSVC)
          if (Test-Path "$llvmBin\llvm-config.exe") {
            Write-Host "llvm-config.exe binary present — testing execution..."
            try {
              $ver = & "$llvmBin\llvm-config.exe" --version 2>&1
              Write-Host "✔ llvm-config.exe executable, version: $ver"
            } catch {
              Write-Host "⚠ llvm-config.exe not executable (MSVC runtime missing). build.sh will use manual LLVM flags."
            }
          } else {
            Write-Host "⚠ llvm-config.exe not installed. build.sh will use manual LLVM flags."
          }

          # Print LLVM include path so we can confirm headers exist
          $llvmInclude = "C:\Program Files\LLVM\include"
          if (Test-Path "$llvmInclude\llvm\Config\llvm-config.h") {
            Write-Host "✔ LLVM headers found at $llvmInclude"
            $versionLine = Select-String -Path "$llvmInclude\llvm\Config\llvm-config.h" -Pattern 'LLVM_VERSION_STRING' | Select-Object -First 1
            Write-Host "   Version header: $versionLine"
          } else {
            Write-Host "⚠ LLVM headers not found — LLVM manual build will fall back to Transpiler"
          }

      # ------------------------------------------------------------------
      # Windows ARM64: ARM64 MSVC cross-compile runtime libs.
      # NOTE: This is still needed for the --target=aarch64-pc-windows-msvc
      # cross-compilation target even when using clang++ from LLVM.
      # ------------------------------------------------------------------
      - name: Install ARM64 cross-compile support (Windows ARM64)
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          choco install visualstudio2022buildtools `
            --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.ARM64" `
            --force --no-progress -y
          Write-Host "✔ ARM64 MSVC runtime libs installed"

      # ------------------------------------------------------------------
      # macOS: install latest Homebrew LLVM
      # ------------------------------------------------------------------
      - name: Install Latest LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/llvm/bin"    >> $GITHUB_PATH

      # ------------------------------------------------------------------
      # Build step — build.sh v5.5 handles all path detection internally.
      # On Windows: detects broken llvm-config and uses manual LLVM flags.
      # ------------------------------------------------------------------
      - name: Build X-Phage
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: bash build.sh

      # ------------------------------------------------------------------
      # Upload full bin/<target>/ folder (binary + .sha256 sidecar)
      # ------------------------------------------------------------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: bin/${{ matrix.target }}/
          if-no-files-found: warn

  # ---------------------------------------------------------
  # Job 2: GitHub Release Creation
  # ---------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./assets

      - name: List downloaded assets (debug)
        run: find ./assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            assets/**/*
          body: |
            ### 🧬 X-Phage Titan Omni-Platform Release
            - **New:** Windows LLVM Native Build now works without MSVC (v5.5 fix).
            - **New:** Added Windows ARM64 Architecture Support.
            - **Security:** SHA256 Checksums automatically generated and uploaded for all binaries.
            - **Architecture:** Native LLVM Code Generation enabled for Linux, macOS, Windows, and Android.
            - **Docker Support:** Available on Docker Hub.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # Job 3: Docker Hub Auto-Publish
  # ---------------------------------------------------------
  docker-publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/xphage:latest
            ${{ secrets.DOCKER_USERNAME }}/xphage:${{ env.VERSION }}
