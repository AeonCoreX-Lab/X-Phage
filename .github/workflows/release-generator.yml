name: X-Phage Titan Modular Builder (LLVM Optimized)

on:
  push:
    tags:
      - 'v*' # v3.2.0 এর মতো ট্যাগ পুশ করলে ট্রিগার হবে
  workflow_dispatch: # ম্যানুয়াল রান করার সুযোগ

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write
      
    strategy:
      fail-fast: false
      matrix:
        include:
          # 🐧 Linux (x64)
          - os: ubuntu-latest
            target: linux
            artifact_name: xphage_linux_x64
            asset_name: xphage_linux_x64
            
          # 🪟 Windows (x64)
          - os: windows-latest
            target: windows
            artifact_name: xphage.exe
            asset_name: xphage_windows_x64
            
          # 🍎 macOS (Universal)
          - os: macos-latest
            target: macos
            artifact_name: xphage_mac
            asset_name: xphage_macos_universal

          # 🤖 Android (ARM64)
          - os: ubuntu-latest
            target: android
            artifact_name: xphage_android_arm64
            asset_name: xphage_android_arm64
            
          # 📱 iOS (ARM64)
          - os: macos-latest
            target: ios
            artifact_name: xphage_ios_arm64
            asset_name: xphage_ios_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- LLVM ইন্সটলেশন এবং PATH ফিক্স ---
      - name: Install LLVM (macOS/iOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm
          # সঠিক পদ্ধতি: সরাসরি ডিরেক্টরি পাথ GITHUB_PATH এ পুশ করা
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install LLVM (Linux/Android)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          echo "/usr/lib/llvm-14/bin" >> $GITHUB_PATH
        shell: bash

      - name: Run Modular Build Script
        run: |
          chmod +x build.sh
          ./build.sh
        shell: bash

      # --- প্যাকেজিং এবং রিলিজ ---
      - name: Prepare Release Bundle
        shell: bash
        run: |
          mkdir -p release_bundle/stdlib
          mkdir -p release_bundle/samples
          
          # বাইনারি কপি
          cp bin/${{ matrix.target }}/${{ matrix.artifact_name }} release_bundle/ || cp ${{ matrix.artifact_name }} release_bundle/
          
          # রিসোর্স কপি
          cp stdlib/*.xh release_bundle/stdlib/ || true
          cp samples/* release_bundle/samples/ || true
          
          # আর্কাইভ তৈরি
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ${{ matrix.asset_name }}.zip ./release_bundle/*
          else
            zip -r ${{ matrix.asset_name }}.zip ./release_bundle/*
          fi

      # --- সিকিউরিটি চেকসাম ---
      - name: Generate SHA256 Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset_name }}.zip > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }}.zip > ${{ matrix.asset_name }}.sha256
          fi

      # --- রিলিজ আপলোড ---
      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.sha256
          body: |
            ## 🧬 X-Phage v3.2 [LLVM TITAN] Official Release
            **Backend:** LLVM Native Compiler with O3 Optimization.
            
            ### 📦 Supported Platforms:
            - 🐧 Linux (x64) | 🪟 Windows (x64) | 🍎 macOS (Universal)
            - 🤖 Android (ARM64) | 📱 iOS (ARM64)

            ### 🛡️ Security:
            - SHA256 Checksums generated for supply-chain integrity.
