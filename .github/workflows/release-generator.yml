name: X-Phage Titan Modular Builder (LLVM Optimized)

on:
  push:
    tags:
      - 'v*' # v3.2.0 er moto tag push korle trigger hobe
  workflow_dispatch: # Manual run korar sujog

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write
      
    strategy:
      fail-fast: false
      matrix:
        include:
          # 🐧 Linux (x64)
          - os: ubuntu-latest
            target: linux
            artifact_name: xphage_linux_x64
            asset_name: xphage_linux_x64
            
          # 🪟 Windows (x64)
          - os: windows-latest
            target: windows
            artifact_name: xphage.exe
            asset_name: xphage_windows_x64
            
          # 🍎 macOS (Universal)
          - os: macos-latest
            target: macos
            artifact_name: xphage_mac
            asset_name: xphage_macos_universal

          # 🤖 Android (ARM64)
          - os: ubuntu-latest
            target: android
            artifact_name: xphage_android_arm64
            asset_name: xphage_android_arm64
            
          # 📱 iOS (ARM64)
          - os: macos-latest
            target: ios
            artifact_name: xphage_ios_arm64
            asset_name: xphage_ios_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- LLVM & Environment Setup ---
      - name: Install LLVM (Linux/Android)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang lld

      - name: Install LLVM (macOS/iOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm
          echo "PATH=$(brew --prefix llvm)/bin:$PATH" >> $GITHUB_APPEND_PATH

      # --- Build Execution ---
      - name: Run Modular Build Script
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x build.sh
          ./build.sh # build.sh script LLVM flags use korbe

      # --- Packaging ---
      - name: Prepare Release Bundle
        shell: bash
        run: |
          mkdir -p release_bundle/stdlib
          mkdir -p release_bundle/samples
          
          # Binary copy (matrix onujayi check)
          if [ -f "bin/${{ matrix.target }}/${{ matrix.artifact_name }}" ]; then
            cp bin/${{ matrix.target }}/${{ matrix.artifact_name }} release_bundle/
          else
            cp ${{ matrix.artifact_name }} release_bundle/ || echo "File path handled by script"
          fi
          
          # Resources copy
          cp stdlib/*.xh release_bundle/stdlib/ || true
          cp samples/* release_bundle/samples/ || true
          
          # Archiving
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ${{ matrix.asset_name }}.zip ./release_bundle/*
          else
            zip -r ${{ matrix.asset_name }}.zip ./release_bundle/*
          fi

      # --- Security Checksum ---
      - name: Generate SHA256 Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset_name }}.zip > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }}.zip > ${{ matrix.asset_name }}.sha256
          fi

      # --- Release Upload ---
      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.sha256
          body: |
            ## 🧬 X-Phage v3.2 [LLVM TITAN] Official Release
            **Backend:** LLVM Native Compiler with O3 Optimization.
            
            ### 📦 Supported Platforms:
            - 🐧 Linux (x64) | 🪟 Windows (x64) | 🍎 macOS (Universal)
            - 🤖 Android (ARM64) | 📱 iOS (ARM64)
            
            ### 🛡️ Security:
            Verified with SHA256 Checksums.
          draft: false
          prerelease: false
